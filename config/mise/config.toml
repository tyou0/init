[tools]
# Keep interactive developer tooling in mise so language/runtime updates travel
# with the dotfiles repo instead of depending on host package managers.
bat = "latest"
bun = "latest"
deno = "latest"
dart = "latest"
direnv = "latest"
go = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "0.12.1"
node = "lts"
"npm:pnpm" = "latest"
python = "3.13"
rust = "latest"
uv = "latest"
#yt-dlp = "latest"
ruby = "latest"
java = "temurin-25"

[settings]

[settings.python]
compile = false
precompiled_flavor = "install_only"

[settings.ruby]
compile = false
