[tools]
# Keep interactive developer tooling in mise so language/runtime updates travel
# with the dotfiles repo instead of depending on host package managers.
bat = "latest"
bun = "latest"
deno = "latest"
dart = { version = "latest", url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip", version_list_url = "https://storage.googleapis.com/storage/v1/b/dart-archive/o?prefix=channels/stable/release/&delimiter=/", version_regex = 'channels/stable/release/(\d+\.\d+\.\d+)/' }
direnv = "latest"
# Use BtbN's static FFmpeg build instead of the asdf ffmpeg plugin, which builds
# an old FFmpeg release from source and can fail on fresh Linux hosts.
"github:BtbN/FFmpeg-Builds" = { version = "latest", asset_pattern = "ffmpeg-master-latest-linux64-gpl.tar.xz" }
go = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "0.12.1"
node = "lts"
"npm:pnpm" = "latest"
python = "3.13"
rust = "latest"
uv = "latest"
yt-dlp = "latest"
ruby = "latest"
java = "temurin-25"

[settings]

[settings.python]
compile = false
precompiled_flavor = "install_only"
